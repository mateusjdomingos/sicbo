<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sic Bo 5 Dados</title>
<meta name="theme-color" content="#0C3523">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Cinzel:wght@700;900&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: mesa de feltro num só ecrã que rola; barra fixa em baixo com jogador ativo e fichas */
:root{
  --felt:#145236; --felt-deep:#0C3523; --felt-hi:#1B6643;
  --line:#F4ECD2; --ink:#F4ECD2; --muted:#C3D3BE;
  --gold:#E8C46A; --gold-ink:#2A2108;
  --lose:#F4A99B; --winbg:rgba(232,196,106,.18);
  --display:'Cinzel',Georgia,serif;
  --body:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--felt);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.3;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--felt)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-block:20px 24px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 16px;border-bottom:2px solid var(--line);padding-bottom:10px}
h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(24px,6vw,34px);letter-spacing:.08em;line-height:1}
.round{font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.round b{color:var(--gold);font-family:var(--display);font-size:20px}
h2{margin:0;font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
.note{font-size:15px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* zonas de aposta */
.grid{display:grid;gap:8px}
.g-sum{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.g-combo{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-num{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.zone{position:relative;border:2px solid var(--line);border-radius:10px;background:transparent;padding:8px 8px 6px;min-height:88px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;transition:background .15s,border-color .15s}
.zone:hover{background:var(--felt-hi)}
.zone.hot{border-color:var(--gold)}
.z-t{font-size:19px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;line-height:1.05}
.z-s{font-size:15px;color:var(--muted)}
.z-p{font-family:var(--display);font-weight:700;font-size:21px;color:var(--gold)}
.stack{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;min-height:0;margin-top:3px}
.stack:empty{display:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:700;padding:1px 7px 1px 4px;border-radius:999px;background:var(--felt-deep);border:1px solid rgba(244,236,210,.35)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.zone.win{background:var(--winbg);border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.zone.win::after{content:"GANHA";position:absolute;top:4px;right:6px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--gold)}
.zone.push::after{content:"DEVOLVE";position:absolute;top:4px;right:6px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.zone.dim{opacity:.45}

.ncol{display:flex;flex-direction:column;gap:6px}
.ncol .zone.single{min-height:96px}
.ncol .zone.row{min-height:46px;flex-direction:row;flex-wrap:wrap;justify-content:space-between;padding:6px 12px;border-radius:8px}
.ncol .zone.row .z-t{font-size:17px;text-transform:none;letter-spacing:.02em}
.ncol .zone.row .z-p{font-size:18px}
.ncol .zone.row .stack{width:100%;justify-content:flex-start}

/* dados */
.die{display:inline-grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:7px;width:52px;height:52px;border-radius:10px;background:var(--line);flex:none}
.die i{display:block;border-radius:50%;width:100%;aspect-ratio:1;max-width:10px;margin:auto}
.die i.on{background:var(--felt)}
.die.sm{width:30px;height:30px;padding:4px;gap:2px;border-radius:6px}
.die.sm i{max-width:6px}
.die.empty{background:transparent;border:2px dashed var(--muted)}

.panel{border:2px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--felt-deep)}
.slots{display:flex;gap:10px;flex-wrap:wrap}
.slot{border:0;background:none;padding:0;border-radius:12px}
.slot .die{width:54px;height:54px;padding:8px}
.slot .die i{max-width:12px}
.pad{display:flex;gap:6px;flex-wrap:wrap}
.pad .die{width:40px;height:40px;padding:6px;gap:2px}
.pad button{border:2px solid var(--line);background:transparent;border-radius:12px;padding:5px;min-width:48px;min-height:48px;padding:3px;display:flex;align-items:center;justify-content:center}
.pad button:hover{background:var(--felt-hi)}
.read{font-size:19px;font-weight:600;min-height:25px}
.read b{color:var(--gold)}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:2px solid var(--line);background:transparent;border-radius:10px;padding:10px 16px;min-height:46px;font-size:17px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.btn:hover{background:var(--felt-hi)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.primary:hover{filter:brightness(1.07);background:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.warn{border-color:var(--lose);color:var(--lose)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:15px}

/* resultado */
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.rcard{border:1px solid rgba(244,236,210,.4);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.rhead{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:700}
.rhead .net{margin-left:auto;font-family:var(--display);font-size:20px}
.pos{color:var(--gold)} .neg{color:var(--lose)}
.rlines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:15px}
.rlines li{display:flex;justify-content:space-between;gap:10px}
.rlines li span:first-child{color:var(--muted)}

/* histórico */
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 0;border-bottom:1px solid rgba(244,236,210,.25)}
.hist .hr{font-weight:700;color:var(--muted);min-width:64px}
.hist .hd{display:flex;gap:4px}
.hist .hn{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:15px}

/* jogadores */
details.manage{border:2px solid var(--line);border-radius:14px;background:var(--felt-deep)}
details.manage>summary{list-style:none;padding:14px 16px;font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;display:flex;justify-content:space-between}
details.manage>summary::-webkit-details-marker{display:none}
details.manage>summary::after{content:"＋";font-size:18px}
details.manage[open]>summary::after{content:"－"}
.mbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.prow{display:grid;grid-template-columns:minmax(0,1.2fr) auto minmax(0,1.6fr);gap:8px 12px;align-items:center;padding-bottom:12px;border-bottom:1px solid rgba(244,236,210,.25)}
@media (max-width:620px){.prow{grid-template-columns:minmax(0,1fr) auto}.prow .adj{grid-column:1/-1}}
.prow .nm{display:flex;align-items:center;gap:8px;min-width:0}
.prow .bal{font-family:var(--display);font-size:20px;color:var(--gold);text-align:right}
.adj{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.field{background:var(--felt);border:2px solid rgba(244,236,210,.55);border-radius:8px;padding:8px 10px;min-height:42px;width:100%;min-width:0}
.field:focus{border-color:var(--gold);outline:none}
.adj .field{width:96px}
.addp{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.addp label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.addp label .field{font-size:17px;text-transform:none;letter-spacing:0;color:var(--ink)}
.status{font-size:14px;color:var(--muted)}

/* barra fixa */
.bar{position:sticky;bottom:0;z-index:5;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--felt-deep);border-top:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
.bar-in{max-width:1100px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:8px}
.players{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.pbtn{flex:none;display:flex;align-items:center;gap:8px;border:2px solid rgba(244,236,210,.4);background:transparent;border-radius:999px;padding:6px 14px 6px 8px;min-height:44px}
.pbtn .pn{font-weight:700;font-size:17px;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn .pc{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.pbtn[aria-pressed="true"]{border-color:var(--gold);background:var(--winbg)}
.pbtn[aria-pressed="true"] .pc{color:var(--gold)}
.pbtn .dot{width:14px;height:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.chips{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.chip{width:40px;height:40px;border-radius:50%;border:3px dashed rgba(255,255,255,.75);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 0 0 2px var(--felt-deep)}
.chip.big{font-size:12px;letter-spacing:-.02em}
.chip[aria-pressed="true"]{box-shadow:0 0 0 3px var(--gold);transform:translateY(-2px)}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes .take{padding:8px 10px}
.zone.sel{border-style:dashed;border-color:var(--gold);background:var(--winbg)}
.zone.sel::before{content:"NA MÚLTIPLA";position:absolute;top:-9px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:0 6px;background:var(--felt);border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--gold)}
.slip{border:2px dashed var(--gold);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.slip-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between}
.slip-h b{color:var(--gold);font-family:var(--display);font-size:20px}
.legs{display:flex;flex-wrap:wrap;gap:6px}
.leg{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(244,236,210,.5);border-radius:999px;padding:3px 4px 3px 10px;font-size:15px;font-weight:600;background:transparent}
.leg span.x{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;background:var(--felt);font-weight:700}
.slip-a{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.slip-a .field{width:110px}
.mlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.mcard{border:2px dashed rgba(232,196,106,.7);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.mcard .mh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.mcard .mh .num{margin-left:auto;color:var(--gold)}
.mcard .ml{font-size:15px;color:var(--muted)}
.mcard .mf{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}
.take{border:2px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;min-height:44px;font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase}
.take[aria-pressed="true"]{background:var(--lose);border-color:var(--lose);color:var(--felt-deep)}
#mMulti[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.tot{font-size:16px;color:var(--muted)} .tot b{color:var(--ink);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:20;background:var(--line);color:var(--felt-deep);font-weight:700;padding:10px 16px;border-radius:10px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.card{border:2px solid var(--line);border-radius:14px;background:var(--felt-deep);padding:20px;display:flex;flex-direction:column;gap:12px}
.card p{margin:0;max-width:60ch}
.narrow{max-width:460px;margin:8vh auto 0;width:100%}
h1.big{font-size:clamp(26px,7vw,36px)}
.stack-form{display:flex;flex-direction:column;gap:8px}
.stack-form label{font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stack-form .btn{margin-top:6px}
.link{background:none;border:0;padding:6px 0;color:var(--gold);text-decoration:underline;font-size:16px;font-weight:600;align-self:flex-start;min-height:40px}
.hright{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.state{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.state.on{background:var(--gold);color:var(--gold-ink)}
.state.off{border:2px solid var(--lose);color:var(--lose)}
.me{display:inline-flex;align-items:center;gap:6px;font-size:17px;font-weight:600}
.me b{color:var(--gold);font-family:var(--display);font-size:20px}
.banner{border-radius:10px;padding:10px 14px;font-weight:600;font-size:17px}
.banner.on{border:2px solid var(--gold)}
.banner.off{border:2px solid var(--lose);color:var(--lose)}
.zone:disabled{cursor:default}
.zone:disabled:hover{background:transparent}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;padding:10px 12px;min-height:44px;font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tabp{display:flex;flex-direction:column;gap:22px}
.who{display:flex;flex-wrap:wrap;gap:6px}
.wchip{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(244,236,210,.4);border-radius:999px;padding:4px 12px;font-size:16px}
.wchip.over{border-color:var(--lose);color:var(--lose)}
.gold{color:var(--gold)}
.row-actions .field{flex:1 1 220px}

.seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;align-self:flex-start}
.seg button{border:0;background:transparent;padding:8px 14px;min-height:42px;font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--line);color:var(--felt-deep)}
.btn.roll{font-size:20px;min-height:60px;align-self:flex-start;padding-inline:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0}
.stats div{border:1px solid rgba(244,236,210,.35);border-radius:10px;padding:8px 12px}
.stats dt{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:2px 0 0;font-family:var(--display);font-size:22px}
.table-wrap{overflow-x:auto}
.ustats{border-collapse:collapse;width:100%;min-width:520px;font-size:16px}
.ustats th{text-align:left;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}
.ustats td{padding:8px;border-bottom:1px solid rgba(244,236,210,.25)}
.ustats td.num,.ustats th:not(:first-child){text-align:right}
.ustats .dot{display:inline-block;vertical-align:middle}
/* revelação dos dados */
.reveal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(5,22,14,.82)}
.rv-box{width:min(520px,100%);background:var(--felt);border:3px solid var(--gold);border-radius:18px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.rv-dice{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:72px}
.bdie{display:inline-grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px;width:54px;height:54px;border-radius:11px;background:var(--line);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.35)}
.bdie i{display:block;border-radius:50%;width:100%;aspect-ratio:1;max-width:10px;margin:auto}
.bdie i.on{background:var(--felt-deep)}
.bdie.tumble{animation:tumble .32s ease-in-out infinite alternate}
.bdie.land{animation:land .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes tumble{0%{transform:translateY(0) rotate(-14deg)}50%{transform:translateY(-16px) rotate(10deg)}100%{transform:translateY(-4px) rotate(22deg)}}
@keyframes land{0%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.rv-desc{font-size:22px;font-weight:700;min-height:28px}
.rv-label{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);min-height:18px}
.rv-amt{font-family:var(--display);font-weight:900;font-size:clamp(44px,14vw,72px);line-height:1;min-height:1em}
.rv-amt.win{color:var(--gold);text-shadow:0 0 24px rgba(232,196,106,.55)}
.rv-amt.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.rv-sub{font-size:17px;color:var(--muted);min-height:22px}
@media (prefers-reduced-motion:reduce){.bdie.tumble,.bdie.land,.rv-amt.pop{animation:none}}

/* mesa com jogadores e torres de fichas */
.felt{position:relative;border:10px solid #5B3A1E;border-radius:48px;background:radial-gradient(ellipse at center,var(--felt-hi) 0%,var(--felt) 60%,var(--felt-deep) 100%);padding:44px 14px 18px;box-shadow:inset 0 0 0 2px rgba(244,236,210,.25),0 10px 24px rgba(0,0,0,.35)}
.bankpill{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:3px 14px;border-radius:999px}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.seat{border:1px solid rgba(244,236,210,.35);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(0,0,0,.22);min-width:0}
.seat.you{border:2px solid var(--gold)}
.sname{display:flex;align-items:center;gap:6px;font-size:17px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.samt{font-family:var(--display);font-size:20px;color:var(--gold)}
.tower{display:flex;align-items:flex-end;justify-content:center;gap:6px;min-height:118px;flex-wrap:wrap}
.tower.empty{align-items:center}
.tstack{display:flex;flex-direction:column;align-items:center;gap:3px}
.tchips{display:flex;flex-direction:column-reverse}
.tchips i{display:block;width:34px;height:9px;border-radius:50%/60%;margin-top:-2px;border:1px solid rgba(0,0,0,.55)}
.tchips i:nth-child(odd){filter:brightness(1.08)}
.tlab{font-size:12px;color:var(--muted);font-weight:600}

/* temas comprados n'O Mateus Banca */
:root[data-skin="montecarlo"]{--felt:#13294B;--felt-deep:#0B1A33;--felt-hi:#1C3A66;--line:#F2E8D0;--ink:#F2E8D0;--muted:#B9C6DA;--gold:#D9B65D;--gold-ink:#1A1405;--winbg:rgba(217,182,93,.18)}
:root[data-skin="roleta"]{--felt:#5C1A1F;--felt-deep:#3D0F13;--felt-hi:#74242A;--line:#F6E7D2;--ink:#F6E7D2;--muted:#E3C5BC;--gold:#E8C46A;--gold-ink:#2A2108;--lose:#FFB3A6;--winbg:rgba(232,196,106,.18)}
:root[data-skin="vegas"]{--felt:#2A0E3F;--felt-deep:#1A0828;--felt-hi:#3B1659;--line:#F9E7FF;--ink:#F9E7FF;--muted:#D6BCE8;--gold:#FF4FD8;--gold-ink:#22052F;--winbg:rgba(255,79,216,.16)}
:root[data-skin="ebano"]{--felt:#1B1B1D;--felt-deep:#0E0E10;--felt-hi:#2A2A2E;--line:#E6E6E6;--ink:#EDEDED;--muted:#ADB1B8;--gold:#C9CED6;--gold-ink:#111113;--winbg:rgba(201,206,214,.14)}
:root[data-skin="ouro"]{--felt:#3B2A14;--felt-deep:#24190B;--felt-hi:#4E3A1E;--line:#F5E6C4;--ink:#F5E6C4;--muted:#D9C8A2;--gold:#FFD54A;--gold-ink:#2A1E05;--winbg:rgba(255,213,74,.16)}
/* loja */
.shop{display:flex;flex-direction:column;gap:12px}
.shop-h{border:2px solid var(--gold);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px;background:var(--felt-deep);text-align:center;align-items:center}
.shop-eyebrow{font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.shop-title{font-family:var(--display);font-weight:900;font-size:clamp(26px,7vw,36px);letter-spacing:.06em;color:var(--gold);text-transform:none;line-height:1.1}
.shop-bal{font-size:17px}
.shop-bal b{color:var(--gold);font-family:var(--display);font-size:20px}
.shop-sec{margin:10px 0 0;font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.sitem{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"pic info" "pic buy";gap:6px 12px;align-items:center;border:1px solid rgba(244,236,210,.35);border-radius:12px;padding:12px;background:var(--felt-deep)}
.sitem.on{border:2px solid var(--gold)}
.sitem .swatch,.sitem .cdot,.sitem .bigchip{grid-area:pic}
.sinfo{grid-area:info;display:flex;flex-direction:column;gap:2px;min-width:0}
.sinfo b{font-size:18px}
.sbuy{grid-area:buy;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.owned{font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.swatch{position:relative;width:64px;height:64px;border-radius:14px;border:3px solid;display:flex;align-items:flex-end;justify-content:center;gap:4px;padding:8px;box-sizing:border-box}
.swatch span{width:12px;height:12px;border-radius:3px}
.swatch .mini-chip{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;border:2px dashed rgba(255,255,255,.75)}
.cdot{width:44px;height:44px;border-radius:50%;border:3px solid rgba(244,236,210,.6);margin:10px}
.bigchip{width:58px;height:58px;border-radius:50%;border:4px dashed rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;box-shadow:0 0 0 3px var(--felt-deep),0 0 0 5px #7B4A26}
.soon{text-align:center;padding:8px}

.medal{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 3px 8px rgba(0,0,0,.4);margin:4px}
.medal span{font-family:var(--display);font-weight:900;font-size:22px;color:rgba(20,20,20,.75)}
.sitem .medal{grid-area:pic}
.sitem.locked{opacity:.55}
.rbadge{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#1B1B1B;padding:2px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}

/* prémios reais */
.shop-sub{font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:none;color:var(--muted);margin-left:6px}
.remb{grid-area:pic;width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;margin:4px}
.remb.iscte{background:#0A2D5E;color:#FFFFFF;font-size:13px;letter-spacing:.08em;border:2px solid #FFFFFF}
.remb.especial{background:var(--gold);color:var(--gold-ink);font-size:28px;border:2px solid var(--line)}
.stock{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.rdlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rdlist li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:10px 0;border-bottom:1px solid rgba(244,236,210,.25)}
.rcode{font-family:var(--display);font-weight:700;color:var(--gold);min-width:84px}
.rtitle{flex:1 1 180px;min-width:0}
.ractions{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.rstat{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 10px;border-radius:999px;border:1px solid currentColor;margin-left:auto}
.rstat.pendente{color:var(--gold)}
.rstat.entregue{color:#9BE3A8}
.rstat.cancelado{color:var(--lose)}
.rwform{display:flex;flex-direction:column;gap:8px}
.rwform label{font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rwform textarea{resize:vertical;font:inherit}
.rwform select{font:inherit}
.rwrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.check{display:flex;align-items:center;gap:8px;text-transform:none!important;letter-spacing:0!important;font-size:16px!important;color:var(--ink)!important;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--gold)}

/* ===== Salão e painel de mesas ===== */
header .hleft{display:flex;flex-direction:column;gap:2px;min-width:0}
header .hleft h1{font-size:clamp(22px,6vw,30px)}
.link.back{align-self:flex-start;min-height:32px;padding:0;font-size:15px}
.cd{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tcard{border:2px solid rgba(244,236,210,.35);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--felt-deep)}
.tcard.mine{border-color:var(--gold)}
.tc-top{display:flex;align-items:center;gap:12px}
.tc-name{display:flex;flex-direction:column;min-width:0}
.tc-name b{font-size:20px;line-height:1.1}
.tc-state{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tc-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;font-size:15px;color:var(--muted)}
.tc-meta .dot{display:inline-block;margin-left:3px;vertical-align:middle}
.tc-last{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:32px}
.tc-act{display:flex;flex-wrap:wrap;gap:8px}
.btn.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.ticon{flex:none;display:inline-flex;gap:3px;align-items:center;justify-content:center;width:56px;height:56px;border-radius:14px;background:rgba(0,0,0,.25)}
.ticon.dice .die{width:24px;height:24px;padding:3px;gap:1px}
.ticon.dice .die i{max-width:5px}
.ticon.wheel{background:radial-gradient(circle,#E8C46A 0 16%,#3B2A14 17% 34%,transparent 35%),repeating-conic-gradient(#C62828 0 9.73deg,#141414 9.73deg 19.46deg);border:3px solid #5B3A1E;border-radius:50%}
.bygame{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.bygame li{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;border-bottom:1px solid rgba(244,236,210,.2);padding-bottom:6px}
.bygame li .num:last-child{margin-left:auto}
.rpick{font-size:15px;font-weight:600;color:var(--gold)}
/* ===== Roleta ===== */
.rball{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;border-radius:999px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff;border:2px solid rgba(255,255,255,.5)}
.rball.r{background:#C62828}.rball.b{background:#141414}.rball.g{background:#1E8E4E}
.rball.sm{min-width:26px;height:26px;font-size:13px}
.rball.big{min-width:84px;height:84px;font-size:40px;font-family:var(--display);border-width:4px}
.lastnums{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.lastnums .note{margin-right:4px}
.rboard{display:flex;flex-direction:column;gap:6px;max-width:520px;margin:0 auto;width:100%}
.rz{position:relative;border:2px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:44px;padding:3px}
.rz:hover:not(:disabled){filter:brightness(1.15)}
.rz:disabled{cursor:default}
.rz.num.r{background:#B3261E}.rz.num.b{background:#1B1B1B}.rz.num.g{background:#1E7A45}
.rz .rn{font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.rz.zero{min-height:52px}
.rgrid{display:grid;grid-template-columns:minmax(0,.8fr) repeat(3,minmax(0,1fr));gap:4px}
.rz.street{border-style:dashed;border-color:rgba(244,236,210,.55)}
.rz.street .rst{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rz.street .rsub{font-size:12px;color:var(--muted)}
.rcols{display:grid;grid-template-columns:minmax(0,.8fr) repeat(3,minmax(0,1fr));gap:4px}
.rdoz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.rout{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
@media (max-width:420px){.rout{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rz.out .rlab{font-weight:700;font-size:15px}
.rz.out .rpay{font-size:12px;color:var(--gold);font-family:var(--display)}
.rdia{display:inline-block;width:18px;height:18px;transform:rotate(45deg);border:2px solid #fff}
.rdia.r{background:#C62828}.rdia.b{background:#141414}
.rz .stack{position:absolute;bottom:-6px;right:-4px;margin:0;z-index:1}
.rz .stack .pill{font-size:11px;padding:0 5px 0 3px}
.rz.sel{outline:3px solid var(--gold);outline-offset:1px}
.rz.has::after{content:"";position:absolute;top:3px;left:3px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.rz.win{box-shadow:0 0 0 3px var(--gold) inset}
.rz.dim{opacity:.4}
/* roda */
.rv-wheel{position:relative;width:min(260px,70vw);aspect-ratio:1;margin:0 auto}
.rv-rot{width:100%;height:100%;will-change:transform}
.wheel-svg{width:100%;height:100%;display:block}
.rv-pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid var(--gold);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.rv-num{min-height:0;opacity:0;transform:scale(.6);transition:opacity .3s,transform .4s cubic-bezier(.3,1.6,.5,1)}
.rv-num.show{opacity:1;transform:scale(1);min-height:90px}
.rv-stage{display:flex;flex-direction:column;align-items:center;gap:10px}
.rv-table{font-size:14px;letter-spacing:.06em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.rv-num{transition:none}}

</style>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden role="status"></div>
</body>
</html>
